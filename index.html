<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Morning Church Scene</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #9cc9df;
}

body {
    font-family: Arial, sans-serif;
}

#scene {
    width: 100vw;
    height: 100vh;
    display: block;
}

/* ================= SUN ================= */

.sun {
    animation: sunGlow 4s ease-in-out infinite alternate;
    transform-origin: center;
}

@keyframes sunGlow {
    from {
        opacity: .75;
        transform: scale(.96);
    }

    to {
        opacity: 1;
        transform: scale(1.05);
    }
}

/* ================= CLOUDS ================= */

.cloud {
    animation: cloudMove 35s linear infinite;
}

.cloud2 {
    animation: cloudMove2 48s linear infinite;
}

@keyframes cloudMove {
    from {
        transform: translateX(-300px);
    }

    to {
        transform: translateX(1900px);
    }
}

@keyframes cloudMove2 {
    from {
        transform: translateX(1800px);
    }

    to {
        transform: translateX(-500px);
    }
}

/* ================= LAMPS ================= */

.light {
    animation: lampGlow 2.5s ease-in-out infinite alternate;
}

@keyframes lampGlow {
    from {
        opacity: .55;
    }

    to {
        opacity: 1;
    }
}

/* ================= GRASS ================= */

.grass {
    animation: grassMove 3s ease-in-out infinite alternate;
    transform-origin: bottom;
}

@keyframes grassMove {
    from {
        transform: skewX(0deg);
    }

    to {
        transform: skewX(1deg);
    }
}

/* ================= CROSS ================= */

.crossGlow {
    animation: crossGlow 2s ease-in-out infinite alternate;
}

@keyframes crossGlow {
    from {
        filter: drop-shadow(0 0 3px #fff);
    }

    to {
        filter: drop-shadow(0 0 12px #fff5b5);
    }
}

/* ================= MOBILE ================= */

@media(max-width:700px) {

    #scene {
        min-width: 900px;
        transform: translateX(-100px);
    }

}
</style>
</head>
